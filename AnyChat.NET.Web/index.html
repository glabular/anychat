<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnyChat</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="sidebar.css" />
    <link rel="stylesheet" href="chatslist.css" />
  </head>
  <body>
    <div class="layout">
      <div class="spaces-rail">
        <button
          type="button"
          class="spaces-scroll spaces-scroll--up"
          aria-label="Scroll spaces up"
          hidden
        >
          ▲
        </button>
        <fieldset class="spaces-sidebar" id="spaces-sidebar" aria-busy="true">
          <legend>Spaces</legend>
          <div
            class="spaces-loading"
            id="spaces-loading"
            role="status"
            aria-label="Loading spaces"
          >
            <span class="spaces-loading-dot" aria-hidden="true"></span>
            <span class="spaces-loading-dot" aria-hidden="true"></span>
            <span class="spaces-loading-dot" aria-hidden="true"></span>
          </div>

          <!-- <label>
            <input type="radio" name="space" value="A" />
            <span>A</span>
          </label> -->
        </fieldset>
        <button
          type="button"
          class="spaces-scroll spaces-scroll--down"
          aria-label="Scroll spaces down"
          hidden
        >
          ▼
        </button>
      </div>

      <aside class="chat-sidebar">
        <h2>Chats</h2>
        <div
          class="chats-loading"
          id="chats-loading"
          role="status"
          aria-label="Loading chats"
        >
          <span class="chats-loading-dot" aria-hidden="true"></span>
          <span class="chats-loading-dot" aria-hidden="true"></span>
          <span class="chats-loading-dot" aria-hidden="true"></span>
        </div>
        <p class="chats-empty" id="chats-empty" hidden>
          You're all set ✨
          <span class="chats-empty-detail">No chats in this space yet.</span>
        </p>
        <ul id="chats-list"></ul>
      </aside>
      <main class="main">
        <p class="placeholder">Select a chat to start conversation.</p>
      </main>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
