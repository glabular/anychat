<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnyChat</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="sidebar.css" />
    <link rel="stylesheet" href="chatslist.css" />
  </head>
  <body>
    <div class="layout">
      <div class="spaces-rail">
        <button
          type="button"
          class="spaces-scroll spaces-scroll--up"
          aria-label="Scroll spaces up"
          hidden
        >
          ▲
        </button>
        <fieldset class="spaces-sidebar" id="spaces-sidebar" aria-busy="true">
          <legend>Spaces</legend>
          <div
            class="spaces-loading"
            id="spaces-loading"
            role="status"
            aria-label="Loading spaces"
          >
            <span class="spaces-loading-dot" aria-hidden="true"></span>
            <span class="spaces-loading-dot" aria-hidden="true"></span>
            <span class="spaces-loading-dot" aria-hidden="true"></span>
          </div>

          <!-- <label>
            <input type="radio" name="space" value="A" />
            <span>A</span>
          </label> -->
        </fieldset>
        <button
          type="button"
          class="spaces-scroll spaces-scroll--down"
          aria-label="Scroll spaces down"
          hidden
        >
          ▼
        </button>
      </div>

      <aside class="chat-sidebar">
        <h2>Chats</h2>
        <div
          class="chats-loading"
          id="chats-loading"
          role="status"
          aria-label="Loading chats"
          hidden
        >
          <span class="chats-loading-dot" aria-hidden="true"></span>
          <span class="chats-loading-dot" aria-hidden="true"></span>
          <span class="chats-loading-dot" aria-hidden="true"></span>
        </div>
        <p class="chats-empty" id="chats-empty" hidden>
          No chats in this space yet
          <span class="chats-empty-detail">this space</span>
        </p>
        <ul id="chats-list" class="idle-scrollbar"></ul>
      </aside>
      <main class="main">
        <p class="placeholder" id="main-placeholder" hidden>
          Select a space and a chat to start conversation.
        </p>
        <section id="chat-panel" class="chat-panel" hidden>
          <header class="chat-panel-header">
            <h1 id="chat-panel-title" class="chat-panel-title"></h1>
          </header>
          <div
            id="chat-messages"
            class="chat-messages selectable idle-scrollbar"
          >
            <div id="chat-messages-empty" class="chat-messages-empty" hidden>
              <h2 class="chat-messages-empty-title">No messages yet</h2>
              <p class="chat-messages-empty-text">
                Start the conversation by sending the first message.
              </p>
            </div>
            <div id="chat-message-list" class="chat-message-list"></div>
          </div>
          <form id="chat-composer" class="chat-composer">
            <textarea
              id="chat-message-input"
              class="chat-message-input"
              rows="1"
              placeholder="Enter your message"
              aria-label="Message"
            ></textarea>
            <button id="chat-send-button" class="chat-send-button" type="submit">
              Send
            </button>
          </form>
        </section>
      </main>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
