<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnyChat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>AnyChat</h1>
      <label class="space-label" for="space-select">Space</label>
      <select id="space-select" class="space-select" disabled>
        <option value="">Loading spaces…</option>
      </select>
      <p id="status" class="status">Loading spaces…</p>
      <ul id="chat-list" class="chat-list"></ul>
    </aside>
    <main class="main">
      <p class="placeholder">Select a chat later — list only for now.</p>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
