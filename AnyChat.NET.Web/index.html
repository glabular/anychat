<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnyChat</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body>
    <div class="layout">
      <div class="spaces-rail">
        <button
          type="button"
          class="spaces-scroll spaces-scroll--up"
          aria-label="Scroll spaces up"
          hidden
        >
          ▲
        </button>
        <fieldset class="spaces-sidebar" id="spaces-sidebar">
          <legend>Spaces</legend>

          <!-- <label>
            <input type="radio" name="space" value="A" />
            <span>A</span>
          </label> -->
        </fieldset>
        <button
          type="button"
          class="spaces-scroll spaces-scroll--down"
          aria-label="Scroll spaces down"
          hidden
        >
          ▼
        </button>
      </div>

      <aside class="chat-sidebar">
        <h2>Chats</h2>
        <p class="placeholder">
          The lists of chats for selected space will appear here
        </p>
      </aside>
      <main class="main">
        <p class="placeholder">Select a chat to start conversation.</p>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
